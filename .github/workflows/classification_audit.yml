name: Classification audit

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Local date to audit, e.g. 2026-07-03"
        required: true
        default: "2026-07-03"
      timezone:
        description: "Timezone for posted_at grouping"
        required: true
        default: "Asia/Tokyo"
      model:
        description: "Optional free-tier Gemini model override, e.g. gemini-3.5-flash-lite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-run Gemini classification and print differences
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUDIT_DATE: ${{ inputs.date }}
          AUDIT_TIMEZONE: ${{ inputs.timezone }}
          AUDIT_MODEL: ${{ inputs.model }}
        run: |
          args=(--date "$AUDIT_DATE" --timezone "$AUDIT_TIMEZONE")
          if [ -n "$AUDIT_MODEL" ]; then
            args+=(--model "$AUDIT_MODEL")
          fi
          python3 scripts/audit_classification.py "${args[@]}"
