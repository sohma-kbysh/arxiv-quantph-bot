name: Classification audit

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Local date to audit, e.g. 2026-07-03"
        required: true
        default: "2026-07-03"
      timezone:
        description: "Timezone for posted_at grouping"
        required: true
        default: "Asia/Tokyo"
      model:
        description: "Optional free-tier Gemini model override, e.g. gemini-3.5-flash-lite"
        required: false
        default: ""
      limit:
        description: "Maximum papers to audit (1 for a small connection test, 0 for the whole day)"
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-run Gemini classification and print differences
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUDIT_DATE: ${{ inputs.date }}
          AUDIT_TIMEZONE: ${{ inputs.timezone }}
          AUDIT_MODEL: ${{ inputs.model }}
          AUDIT_LIMIT: ${{ inputs.limit || '0' }}
        run: |
          args=(--date "$AUDIT_DATE" --timezone "$AUDIT_TIMEZONE" --limit "$AUDIT_LIMIT")
          if [ -n "$AUDIT_MODEL" ]; then
            args+=(--model "$AUDIT_MODEL")
          fi
          python3 scripts/audit_classification.py "${args[@]}"

      - name: Upload sanitized audit diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: error_diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 7
