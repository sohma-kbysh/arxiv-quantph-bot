name: SciRate daily and weekly quant-ph digest

on:
  schedule:
    # Daily Top 3 at 23:30 JST on normal arXiv announcement weekdays.
    - cron: "30 14 * * 1-5"
    # Weekly 30+ digest at 23:30 JST on Sunday.
    - cron: "30 14 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Digest mode (auto follows the JST weekday)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - daily
          - weekly
      date:
        description: Target end date in JST (YYYY-MM-DD; blank = today)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: arxiv-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SCIRATE_DIGEST_MODE: ${{ github.event.inputs.mode || 'auto' }}
      SCIRATE_TARGET_DATE: ${{ github.event.inputs.date || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Discover SciRate digest papers
        id: discover
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_BOT_EMERGENCY: ${{ secrets.DISCORD_WEBHOOK_BOT_EMERGENCY }}
          # Optional repo variable. Blank uses the anticipated upstream #535
          # URL from config.json; set it if SciRate publishes another path.
          # Supported placeholders: {date}, {days}, and {page}.
          SCIRATE_API_URL_TEMPLATE: ${{ vars.SCIRATE_API_URL_TEMPLATE }}
          SCIRATE_API_PAGE_SIZE: ${{ vars.SCIRATE_API_PAGE_SIZE }}
          SCIRATE_API_MAX_PAGES: ${{ vars.SCIRATE_API_MAX_PAGES }}
        run: python scirate_weekly.py --discover-only

      - name: Commit discovered SciRate digest queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scirate_weekly_state.json
          git diff --cached --quiet || git commit -m "checkpoint scirate queue [skip ci]"
          git pull --rebase origin main
          git push

      - name: Translate queued SciRate digest papers
        id: translate
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python scirate_weekly.py --translate-only

      - name: Commit translated SciRate digest queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scirate_weekly_state.json
          git diff --cached --quiet || git commit -m "update scirate translations [skip ci]"
          git pull --rebase origin main
          git push

      - name: Deliver queued SciRate digest papers
        id: deliver
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_SCIRATE: ${{ secrets.DISCORD_WEBHOOK_SCIRATE }}
          DISCORD_WEBHOOK_BOT_EMERGENCY: ${{ secrets.DISCORD_WEBHOOK_BOT_EMERGENCY }}
        run: python scirate_weekly.py --deliver-only

      - name: Commit SciRate digest delivery receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scirate_weekly_state.json
          git diff --cached --quiet || git commit -m "update scirate receipts [skip ci]"
          git pull --rebase origin main
          git push

      - name: Surface SciRate acquisition or delivery failure
        if: ${{ steps.discover.outcome == 'failure' || steps.translate.outcome == 'failure' || steps.deliver.outcome == 'failure' }}
        run: |
          echo "SciRate discovery, translation, or delivery failed; see the preceding step logs."
          exit 1

      - name: Upload sanitized error diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: error-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: error_diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 30
